<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | PixelCraft Agency</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation -->
  <header>
    <a href="index.html" class="logo">Pixel<span>Craft</span></a>
    <div class="menu-toggle" onclick="document.querySelector('nav').classList.toggle('show')">☰</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="services.html">Services & Pricing</a>
      <a href="contact.html" class="nav-cta active">Get a Quote</a>
    </nav>
  </header>

  <!-- Contact Section -->
  <div class="container">
    <h2 class="section-title">Start Your Project</h2>
    <p class="section-subtitle">Fill out the details below and we will reply within 24 hours with a custom plan.</p>

    <div class="contact-wrapper">
      <form action="https://formspree.io/f/xaybzc12" method="POST">
      <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
        <div class="form-group">
          <label for="name">Your Name *</label>
          <input type="text" id="name" name="name" placeholder="John Doe" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address *</label>
          <input type="email" id="email" name="email" placeholder="john@company.com" required>
        </div>

        <div class="form-group">
          <label for="package">Select Package</label>
          <select id="package" name="package">
            <option value="Landing Page ($150)">High-Converting Landing Page ($150)</option>
            <option value="Business Website ($300)">Multi-Page Business Website ($300)</option>
            <option value="Custom Redesign ($450+)">Website Redesign / Custom Front-End ($450+)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="details">Project Details *</label>
          <textarea id="details" name="details" rows="5" placeholder="Tell us about your business, website goals, and deadline..." required></textarea>
        </div>

        <button type="submit" class="btn" style="width: 100%;">Send Project Inquiry</button>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 PixelCraft Agency. Front-End Web Development & Landing Page Design.</p>
  </footer>

</body>
</html>
